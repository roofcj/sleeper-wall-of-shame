name: Update Sleeper Wall of Shame

on:
  workflow_dispatch:
  # Twice per hour (GitHub may delay scheduled runs).
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: sleeper-wall-of-shame-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read finished NFL games and Sleeper lineups
        env:
          SLEEPER_LEAGUE_ID: ${{ vars.SLEEPER_LEAGUE_ID || '1391788553402347520' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tracker.py
      - name: Save updated leaderboard and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if ! git diff --cached --quiet; then
            git commit -m "Update Wall of Shame results"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Package dashboard for publishing
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  publish:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy refreshed dashboard
        id: deployment
        uses: actions/deploy-pages@v4
